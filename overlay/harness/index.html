<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bicycle 42 harness</title>
  <style>
    :root { --bg: #0b0d12; --panel: #12151c; --line: #232838; --text: #e6e8ee; --muted: #8a90a2; --accent: #a78bfa; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-columns: 1fr 340px; background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, sans-serif; }
    .stage { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
    .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    .bar .mode { padding: 3px 8px; border-radius: 6px; background: #2a2f3f; color: var(--muted); font-weight: 600; }
    .bar .mode.on { background: #3b2a6b; color: #ddd6fe; }
    .bar .spacer { flex: 1; }
    button, select { background: #1b1f2a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
    .frame-wrap { display: flex; justify-content: center; overflow: auto; background: #1a1d26; padding: 12px; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 8px; background: #fff; }
    aside { display: grid; grid-template-rows: auto 1fr auto; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
    aside h2 { margin: 0; padding: 10px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
    ol { list-style: none; margin: 0; padding: 0; overflow: auto; }
    li { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
    li.active { background: #191d28; }
    li .row { display: flex; gap: 8px; align-items: baseline; }
    li .n { font-weight: 700; color: var(--accent); }
    li .st { margin-left: auto; font-size: 11px; color: var(--muted); }
    li .st.working { color: #fbbf24; } li .st.done { color: #4ade80; }
    li .tg { color: var(--muted); font-family: ui-monospace, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    pre { margin: 0; padding: 10px 12px; max-height: 40vh; overflow: auto; border-top: 1px solid var(--line);
      font: 11px/1.45 ui-monospace, monospace; white-space: pre-wrap; color: #cbd0dc; }
    .unplaced { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bar">
      <span class="mode" id="mode">Review off</span>
      <button id="toggle" title="mod+shift+M">Toggle</button>
      <select id="width" aria-label="Device width">
        <option value="">Full width</option>
        <option value="390">390 · phone</option>
        <option value="768">768 · tablet</option>
        <option value="1280">1280 · laptop</option>
      </select>
      <span class="spacer"></span>
      <button id="rerender" title="Replace the cards' DOM, like a framework re-render">Re-render</button>
      <button id="reload" title="Reload the page; drafts and pins must survive">Reload page</button>
    </div>
    <div class="frame-wrap"><iframe id="page" title="Page under review"></iframe></div>
  </div>
  <aside>
    <h2 id="counts">No notes yet</h2>
    <ol id="notes"></ol>
    <pre id="prompt">Select a note to see the prompt the agent would get.</pre>
  </aside>
  <script type="module" src="./host.js"></script>
</body>
</html>
